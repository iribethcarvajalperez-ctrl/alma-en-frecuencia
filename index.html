<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alma en Frecuencia</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 18px;
  min-height: 100vh;
  background: linear-gradient(160deg, #080711, #24172d, #090812);
  color: #f1dfc6;
  font-family: Georgia, serif;
  text-align: center;
}

h1 {
  color: #d9b783;
  font-size: 34px;
  letter-spacing: 4px;
  margin-top: 55px;
}

.linea {
  width: 90px;
  height: 1px;
  background: #d9b783;
  margin: 25px auto;
}

.subtitulo {
  color: #c6a5bd;
  font-style: italic;
  letter-spacing: 2px;
  margin-top: 35px;
}

.frase {
  font-size: 19px;
  line-height: 1.9;
  max-width: 600px;
  margin: 25px auto;
}

video {
  display: block;
  width: 100%;
  max-width: 650px;
  margin: 35px auto;
  border-radius: 12px;
  background: #000;
}

footer {
  margin-top: 60px;
  color: #a895a9;
  font-size: 13px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<h1>ALMA EN FRECUENCIA</h1>

<div class="linea"></div>

<p class="subtitulo">
Un espacio para sentir, recordar y renacer.
</p>

<p class="frase">
Hay tormentas que llegan en silencio,
rompen lo que creíamos eterno
y nos enseñan a escuchar nuestra propia alma.
</p>

<p class="frase">
Después de la tormenta,
siempre existe una historia por descubrir.
</p>

<video controls playsinline preload="metadata">
<video controls playsinline preload="metadata">
  <source src="tormenta-web 2.mp4" type="video/mp4">
  Tu navegador no puede reproducir este video.
</video>
</footer>

</body>
</html>
